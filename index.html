<script>
function $(id){ return document.getElementById(id); }

function detectPlatform(url){
  if(url.includes('mobile.de')) return 'mobile';
  if(url.includes('autoscout24')) return 'autoscout';
  if(url.includes('marktplaats.nl')) return 'marktplaats';
  return null;
}

function get(html, patterns){
  for(const p of patterns){
    const m = html.match(p);
    if(m && m[1]) return m[1].trim();
  }
  return null;
}

function extractImages(html){

const images = [];

const patterns = [
/"image"\s*:\s*"([^"]+)"|"(https?:\/\/[^"]*marktplaats[^"]+\.(?:jpg|jpeg|png)[^"]*)"/gi,
/"imageUrl"\s*:\s*"([^"]+)"/gi,
/"originalUrl"\s*:\s*"([^"]+)"/gi,
/"fullImageUrl"\s*:\s*"([^"]+)"/gi,
/<meta[^>]+property="og:image"[^>]+content="([^"]+)"/gi
];


patterns.forEach(pattern => {

let match;

while((match = pattern.exec(html)) !== null){

let img = match[1];

if(!img) continue;


// URL herstellen
img = img
.replace(/\\u002F/g,"/")
.replace(/\\/g,"");


// ongewenste afbeeldingen verwijderen
if(
img.includes("logo") ||
img.includes("dealer") ||
img.includes("avatar") ||
img.includes("icon") ||
img.includes("placeholder")
){
continue;
}


// parameters verwijderen
let cleanImg = img;


// Marktplaats hogere resolutie proberen
if(cleanImg.includes("marktplaats")){

    cleanImg = cleanImg
    .replace(/width=\d+/g, "width=1600")
    .replace(/height=\d+/g, "height=1200")
    .replace(/w=\d+/g, "w=1600")
    .replace(/h=\d+/g, "h=1200");

}


// AutoScout24: probeer grotere versie af te dwingen
cleanImg = cleanImg
.replace(/\/\d+x\d+\//, '/1600x1200/')
.replace(/width=\d+/g, 'width=1600')
.replace(/height=\d+/g, 'height=1200');


// Marktplaats CDN hogere kwaliteit
cleanImg = cleanImg
.replace(/width=\d+/g,'width=1600')
.replace(/height=\d+/g,'height=1200');


if(!images.includes(cleanImg)){
    images.push(cleanImg);
}

}

});


return images.slice(0,10);

}  

function parseMobile(html){
  const title = get(html,[/<h1[^>]*>([^<]{5,80})<\/h1>/i,/<title>([^<|–-]{5,80})/i]);
  const price = get(html,[

/"price"\s*:\s*\{[^}]*?"value"\s*:\s*(\d{3,7})/i,

/class="[^"]*price[^"]*"[^>]*>([\d.\s€]+)/i,

/(\d{1,3}(?:\.\d{3})+)\s*€/i

]);
  const km    = get(html,[/\"mileage\"\s*:\s*\{[^}]*\"value\"\s*:\s*\"?([\d.,]+)/i,/([\d]{2,3}\.[\d]{3})\s*km/i,/(\d+)\s*km\b/i]);
  const year  = get(html,[/\"firstRegistration\"\s*:\s*\{[^}]*\"year\"\s*:\s*(\d{4})/i,/Erstzulassung[^>]*>\s*(\d{2}\/\d{4})/i,/(\b20[01]\d\b)/]);
  const fuel  = get(html,[/\"fuel\"\s*:\s*\"([^\"]+)\"/i,/Kraftstoff[^>]*>\s*([^<\n,]{3,20})/i]);
  const power = get(html,[
/(\d{2,3})\s*(?:pk|PK|kW)/i,
/"power"\s*:\s*"?(?:value"?\s*:\s*)?(\d{2,3})/i,
/(\d{3})\s*PS/i
]);
  const color = get(html,[/Farbe[^>]*>\s*([^<\n,]{3,20})/i,/\"color\"\s*:\s*\"([^\"]{3,20})\"/i]);

  let priceLevel = null;
  if(/guter\s*preis|sehr\s*guter\s*preis|good.price|great.price/i.test(html)) priceLevel='low';
  else if(/hoher\s*preis|high.price/i.test(html)) priceLevel='high';
  else if(/fairer?\s*preis|fair.price/i.test(html)) priceLevel='avg';


return {
    platform:'mobile.de',
    title,
    price,
    km,
    year,
    fuel,
    power,
    color,
    priceLevel
};

}
 
function parseAutoscout(html){
  const title = get(html,[/<h1[^>]*>([^<]{5,80})<\/h1>/i,/<title>([^<|–]{5,80})/i]);
  const price = get(html,[

/"price"\s*:\s*\{[^}]*?"value"\s*:\s*(\d{3,7})/i,

/class="[^"]*price[^"]*"[^>]*>([\d.\s€]+)/i,

/(\d{1,3}(?:\.\d{3})+)\s*€/i

]);
  const km = get(html,[
/"mileage"\s*:\s*"?([\d.,]+)\s*km/i,
/"mileage"\s*:\s*\{[^}]*"value"\s*:\s*"?([\d.,]+)/i,
/([\d]{2,3}\.[\d]{3})\s*km/i,
/(\d+)\s*km\b/i
]);

const year = get(html,[
/"firstRegistration"[^}]*"year"\s*:\s*(\d{4})/i,
/Erstzulassung[^0-9]*(20\d{2})/i,
/(\b20[01]\d\b)/
]);

const fuel = get(html,[
/"fuel"\s*:\s*"([^"]+)"/i,
/Kraftstoff[^>]*>\s*([^<\n,]{3,20})/i
]);
  const power = get(html,[

/"power"\s*:\s*"?(\d+)/i,

/(\d{2,3})\s*(?:pk|PK|PS)/i,

/(\d{2,3})\s*kW/i

]);
  const color = get(html,[/\"color\"\s*:\s*\"([^\"]{3,20})\"/i]);

  let priceLevel = null;
  if(/top.offer|great.deal|guter.preis/i.test(html)) priceLevel='low';
  else if(/overpriced|too.expensive/i.test(html)) priceLevel='high';
  else if(/fair|average/i.test(html)) priceLevel='avg';

return {
    platform:'autoscout24.nl',
    title,
    price,
    km,
    year,
    fuel,
    power,
    color,
    priceLevel
};

}
 
function parseMarktplaats(html){

  const title = get(html,[
    /<h1[^>]*>([^<]{5,120})<\/h1>/i,
    /<title>([^<|–]{5,120})/i
  ]);


  const price = get(html,[

    // Nieuwe Marktplaats JSON structuur
    /"priceCents"\s*:\s*"?(\d+)"?/i,

    // zichtbare prijs
    /€\s*([\d]{1,3}(?:\.[\d]{3})*)/i,

    // fallback
    /([\d]{1,3}(?:\.[\d]{3})+)\s*€/i

  ]);


  const km = get(html,[

    /"mileage"\s*:\s*"?([\d.]+)/i,

    /([\d]{1,3}(?:\.[\d]{3})+)\s*km/i,

    /(\d+)\s*km\b/i

  ]);


  const year = get(html,[

    /"constructionYear"\s*:\s*"?(\d{4})/i,

    /\b(20\d{2})\b/i,

    /\b(19\d{2})\b/i

  ]);


  const fuel = get(html,[

    /"fuelType"\s*:\s*"([^"]+)"/i,

    /brandstof[^>]*>\s*([^<\n,]{3,20})/i

  ]);


  const power = get(html,[

    /"power"\s*:\s*"?(\d+)/i,

    /(\d+)\s*(?:pk|PK|pk)/i,

    /(\d+)\s*PS/i

  ]);


  const color = get(html,[

    /"color"\s*:\s*"([^"]+)"/i,

    /kleur[^>]*>\s*([^<\n,]{3,20})/i

  ]);


  let priceLevel = null;


return {
    platform:'Marktplaats.nl',
    title,
    price,
    km,
    year,
    fuel,
    power,
    color,
    priceLevel
};

}
  
function cleanPrice(raw, platform){

  if(!raw) return null;

  let n = parseInt(raw.replace(/[^\d]/g,''));

  if(isNaN(n)) return null;


  // Alleen Marktplaats gebruikt soms centen
  if(platform === 'marktplaats' && n > 100000){
      n = Math.round(n / 100);
  }


  if(n < 500 || n > 2000000){
      return null;
  }

  return n;
}
  
function cleanKm(raw){
  if(!raw) return null;
  const n = parseFloat(raw.replace(/[^\d]/g,''));
  return isNaN(n) ? null : n;
}

function priceAdvice(price, km, year, title){

  if(!price || !year) return null;
  if(price < 500 || price > 2000000) return null;

  const age = 2026 - parseInt(year);
  const kmN = km || (age * 15000);

  const titleLower = (title || '').toLowerCase();

  let estimated;


  // EXOTISCHE AUTO'S
  // Deze markt werkt anders dan normale auto's
  if(
    titleLower.includes('lamborghini') ||
    titleLower.includes('ferrari') ||
    titleLower.includes('mclaren') ||
    titleLower.includes('aston martin') ||
    titleLower.includes('rolls royce') ||
    titleLower.includes('bentley')
  ){

    estimated = 200000;

  }

  // HIGH PERFORMANCE PREMIUM
  else if(
    titleLower.includes('porsche') ||
    titleLower.includes('rs6') ||
    titleLower.includes('rs7') ||
    titleLower.includes('amg') ||
    titleLower.includes('m3') ||
    titleLower.includes('m4') ||
    titleLower.includes('m5')
  ){

    estimated = 90000;

  }

  // NORMALE AUTO'S
  else {

    let basePrice = 35000;

    estimated = basePrice * Math.pow(0.88, age);

  }


  // Kilometercorrectie
  // 15.000 km per jaar als gemiddelde
  const expectedKm = age * 15000;
  const kmDiff = kmN - expectedKm;

  estimated -= kmDiff * 0.05;


  // Ondergrens
  estimated = Math.max(estimated, 1500);


  const ratio = price / estimated;


  if(ratio < 0.85){

    return {
      level:'low',
      label:'Onder marktwaarde',
      icon:'✓',
      text:
      `Op basis van leeftijd, kilometerstand en voertuigcategorie lijkt de vraagprijs <strong>aantrekkelijk</strong>. 
      De auto lijkt ongeveer ${Math.round((1-ratio)*100)}% onder een geschatte marktwaarde te staan. 
      Controleer altijd onderhoudshistorie, schadeverleden en documentatie.`
    };

  }


  if(ratio > 1.15){

    return {
      level:'high',
      label:'Boven marktwaarde',
      icon:'✗',
      text:
      `De vraagprijs lijkt ongeveer ${Math.round((ratio-1)*100)}% boven een geschatte marktwaarde te liggen. 
      Bij exclusieve auto's kan dit gerechtvaardigd zijn door uitvoering, onderhoud, opties of lage kilometerstand.`
    };

  }


  return {
    level:'avg',
    label:'Marktconform',
    icon:'~',
    text:
    `De vraagprijs lijkt redelijk marktconform. 
    Bij exclusieve voertuigen zijn historie, uitvoering, kleurcombinatie en onderhoud vaak belangrijker dan alleen leeftijd en kilometers.`
  };

}

async function analyzeAd(){
  const url = $('adUrl').value.trim();
  const errEl = $('error');
  const loadEl = $('loading');
  const resultEl = $('result');
  const btn = $('analyzeBtn');

  errEl.style.display = 'none';
  resultEl.style.display = 'none';

  if(!url){ errEl.textContent = 'Vul een advertentielink in.'; errEl.style.display='block'; return; }

  const platform = detectPlatform(url);
  if(!platform){ errEl.textContent = 'Niet-ondersteund platform. Gebruik een Mobile.de, AutoScout24 of Marktplaats.nl link.'; errEl.style.display='block'; return; }

  loadEl.style.display = 'block';
  btn.disabled = true;

  try {
    const resp = await fetch(`/api/fetch-ad?url=${encodeURIComponent(url)}`);
    const data = await resp.json();

    if(!resp.ok || data.error) throw new Error(data.error || 'Ophalen mislukt');

    const html = data.html;
const images = data.images || [];

    console.log("DATA VAN SERVER:", data);
console.log("FOTO'S:", images);

let parsed;
if(platform==='mobile') parsed = parseMobile(html);
else if(platform==='autoscout') parsed = parseAutoscout(html);
else parsed = parseMarktplaats(html);

parsed.images = images;

    
    const priceNum = cleanPrice(parsed.price, platform);
const kmNum = cleanKm(parsed.km);

console.log("RAW PRICE:", parsed.price);
console.log("CLEAN PRICE:", priceNum);
console.log("YEAR:", parsed.year);
console.log("KM:", kmNum);

const advice = priceAdvice(
    priceNum,
    kmNum,
    parsed.year,
    parsed.title
);

    // Prijs indicator: Mobile.de/AutoScout eigen indicator heeft voorrang
    const finalLevel = parsed.priceLevel || (advice ? advice.level : null);

    const pillMap = {
      low:  '<span class="pill pill-low">✓ Goede prijs</span>',
      avg:  '<span class="pill pill-avg">~ Marktconform</span>',
      high: '<span class="pill pill-high">✗ Hoge prijs</span>'
    };
    const verdictClass = {low:'v-good', avg:'v-avg', high:'v-bad'};

    const fmt = (n) => n ? '€\u00a0' + Math.round(n).toLocaleString('nl-NL') : '—';
    const fmtKm = (n) => n ? Math.round(n).toLocaleString('nl-NL') + ' km' : '—';

    resultEl.innerHTML = `
<div class="card">

${parsed.images && parsed.images.length ? `

<div class="main-image">
<img src="${parsed.images[0]}" alt="Vehicle image">
</div>

` : ''}

<div class="car-title">${parsed.title || 'Voertuig'}</div>

<div class="car-url">
${parsed.platform} · 
<a href="${url}" target="_blank" style="color:#333;text-decoration:none;">
${url.substring(0,60)}…
</a>
</div>

<div class="stats">
  <div class="stat">
    <div class="sl">Vraagprijs</div>
    <div class="sv" style="color:#c9a84c">${fmt(priceNum)}</div>
  </div>
  <div class="stat">
    <div class="sl">Kilometerstand</div>
    <div class="sv">${fmtKm(kmNum)}</div>
  </div>
  <div class="stat">
    <div class="sl">Bouwjaar</div>
    <div class="sv">${parsed.year || '—'}</div>
  </div>
  <div class="stat">
    <div class="sl">Brandstof</div>
    <div class="sv">${parsed.fuel || '—'}</div>
  </div>

</div>

${advice || finalLevel ? `
      <div class="verdict ${verdictClass[finalLevel] || 'v-avg'}">
        <div class="vt">
          ${pillMap[finalLevel] || ''}
          Koopadvies
        </div>
        <div class="vd">${advice ? advice.text : 'Onvoldoende data voor een volledig advies. Controleer de voertuighistorie en vergelijk met vergelijkbare advertenties.'}</div>
      </div>` : ''}

      <div class="card">
        <div class="section-label">Advertentieoverzicht</div>
        <div class="brow"><span class="bl">Platform</span><span class="bv">${parsed.platform}</span></div>
        <div class="brow"><span class="bl">Titel</span><span class="bv">${parsed.title || '—'}</span></div>
        <div class="brow"><span class="bl">Vraagprijs</span><span class="bv">${fmt(priceNum)}</span></div>
        <div class="brow"><span class="bl">Kilometerstand</span><span class="bv">${fmtKm(kmNum)}</span></div>
        <div class="brow"><span class="bl">Bouwjaar</span><span class="bv">${parsed.year || '—'}</span></div>
        <div class="brow"><span class="bl">Brandstof</span><span class="bv">${parsed.fuel || '—'}</span></div>
       ${parsed.power ? `
<div class="brow">
<span class="bl">Vermogen</span>
<span class="bv">${parsed.power}</span>
</div>
` : ''}

${parsed.color ? `
<div class="brow">
<span class="bl">Kleur</span>
<span class="bv">${parsed.color}</span>
</div>` : ''}
        ${finalLevel ? `<div class="brow"><span class="bl">Prijsindicatie</span><span class="bv">${pillMap[finalLevel]}</span></div>` : ''}
      </div>

      <p class="disclaimer">* Indicatief koopadvies op basis van geparseerde advertentiedata en een globale marktschatting. Geen vervanging voor een professionele voertuiginspectie. APEXclusive aanvaardt geen aansprakelijkheid voor beslissingen op basis van dit rapport.</p>
      <button class="reset" onclick="resetTool()">↺ Nieuwe analyse</button>
    `;

    resultEl.style.display = 'block';
    resultEl.scrollIntoView({behavior:'smooth', block:'start'});

  } catch(e) {
    errEl.textContent = 'Ophalen mislukt: ' + e.message + '. Controleer of de link correct is en publiek toegankelijk.';
    errEl.style.display = 'block';
  } finally {
    loadEl.style.display = 'none';
    btn.disabled = false;
  }
}

function resetTool(){
  $('result').style.display = 'none';
  $('error').style.display = 'none';
  $('adUrl').value = '';
}
</script>
</body>
</html>
